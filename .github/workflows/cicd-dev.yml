# Plantilla: QuantumTechPE/qt-infra templates/config (repo de configuración por ambiente)
# CICD DEV · merge en pre-develop → el clúster dev toma dev/<servicio>-dev.yaml:
# secretos declarados → Vault, config.yaml → qt-gitops, Argo CD Synced + Healthy.
name: CICD DEV

on:
  push:
    branches: [pre-develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cd:
    name: CICD
    uses: QuantumTechPE/qt-infra/.github/workflows/config-cd.yml@master
    with:
      environment: dev
    permissions:
      contents: read
      id-token: write
